    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How is the IB total calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Add your six subject grades (each 1–7) to get up to 42 points, then add 0–3 core points from TOK and the Extended Essay. The maximum is 45."
            }
          },
          {
            "@type": "Question",
            "name": "How do TOK and EE points work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "TOK and EE are each graded A–E. Together they give 0–3 points. An E in either means no diploma."
            }
          },
          {
            "@type": "Question",
            "name": "What are the diploma failing conditions?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You need 24+ points, CAS complete, no E in TOK or EE, no grade 1, at most two grade 2s, at most three grades of 3 or below, 12+ HL points and 9+ SL points (or 5+ with two SL subjects)."
            }
          },
          {
            "@type": "Question",
            "name": "What if I take 4 HL subjects?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Only the three highest HL grades count for the 12-point rule, and with two SL subjects you need at least 5 SL points."
            }
          },
          {
            "@type": "Question",
            "name": "Does SL count less than HL?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Every subject grade counts equally toward the total out of 45."
            }
          },
          {
            "@type": "Question",
            "name": "Are these official grade boundaries?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Grade boundaries are given only to coordinators, so this calculator works on grades 1–7 only."
            }
          }
        ]
      }
    </script>
